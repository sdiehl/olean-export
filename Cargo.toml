[package]
name = "olean-export"
version = "0.1.0"
authors = ["Stephen Diehl <stephen.m.diehl@gmail.com>"]
categories = ["mathematics", "lean", "lean4"]
documentation = "https://docs.rs/olean-export"
edition = "2021"
homepage = "https://github.com/sdiehl/olean-export"
include = [
  "src/**/*",
  "examples/demo.rs",
  "examples/Hello.lean",
  "examples/Makefile",
  "tests/**/*",
  "README.md",
  "CHANGELOG.md",
  "LICENSE",
  "Cargo.toml",
]
keywords = ["lean", "lean4", "olean", "theorem-prover", "kernel"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/sdiehl/olean-export"
description = "Optimized library for reading Lean .olean files directly emitting lean4export-compatible NDJSON for external kernel checkers."

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
hashbrown = "0.17"
indicatif = "0.18.6"
itoa = "1.0.18"
memmap2 = "0.9.11"
mimalloc = { version = "0.1.52", optional = true }
parking_lot = "0.12.5"
rayon = "1.12.0"
rustc-hash = "2"
thiserror = "2"

[features]
mimalloc = ["dep:mimalloc"]

[[example]]
name = "demo"
path = "examples/demo.rs"

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }

[dev-dependencies]
insta = { version = "1.41", features = ["glob"] }

[profile.release]
lto = "fat"
codegen-units = 1
