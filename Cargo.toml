[package]
name = "tiny-olean"
version = "0.1.0"
authors = ["Stephen Diehl <stephen.m.diehl@gmail.com>"]
categories = ["algorithms"]
edition = "2021"
keywords = ["tutorial"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/sdiehl/tiny-olean"
description = "Read Lean 4 .olean files directly in Rust and emit the lean4export NDJSON stream for external kernel checkers."

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
hashbrown = "0.17"
indicatif = "0.18.6"
rustc-hash = "2"

[[example]]
name = "demo"
path = "examples/demo.rs"

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }

[dev-dependencies]
insta = { version = "1.41", features = ["glob"] }
